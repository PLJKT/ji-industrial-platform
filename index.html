<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JI Industrial Platform — Asset, Service &amp; Utility Operations</title>
<meta name="description" content="Bilingual operations platform for Jababeka Infrastructure: vacant asset register, one-stop service revenue, and water / waste utility performance.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E1A2B'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' fill='%23D8A24A' text-anchor='middle'%3EJI%3C/text%3E%3C/svg%3E">
<script src="https://fastly.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{
  --ink:#0E1A2B; --ink-2:#182A42; --paper:#F4F2ED; --card:#FFFFFF;
  --line:#E1DCD3; --line-2:#EDEAE3; --text:#1B2430; --muted:#6C727C; --faint:#9AA0A8;
  --amber:#A9701C; --amber-soft:#F3E7D2; --teal:#2C6E6A; --teal-soft:#DDEAE7;
  --red:#A8452F; --red-soft:#F5E0DA; --blue:#2F4F7A;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --radius:2px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-0.015em}
::selection{background:var(--amber-soft)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:#E8E6E1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:26px 22px 22px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{display:flex;align-items:center;gap:10px}
.monogram{width:34px;height:34px;border:1px solid rgba(216,162,74,.55);display:grid;place-items:center;font-family:Georgia,"Times New Roman",serif;font-size:16px;color:#D8A24A;letter-spacing:.02em}
.brand-name{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#F3F1EC}
.brand-sub{font-size:11px;color:#8C97A6;margin-top:4px;letter-spacing:.02em}
.nav{padding:14px 0;overflow:auto;flex:1}
.nav-label{padding:14px 22px 6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#78849A}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 20px 10px 22px;color:#AEB7C4;font-size:13px;cursor:pointer;border-left:2px solid transparent}
.nav-item:hover{color:#F3F1EC;background:rgba(255,255,255,.04)}
.nav-item.active{color:#F7F5F0;background:rgba(216,162,74,.10);border-left-color:#D8A24A}
.nav-item svg{width:16px;height:16px;flex:0 0 16px;opacity:.85}
.nav-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{padding:16px 22px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:#78849A;line-height:1.6}
.side-foot b{display:block;color:#AEB7C4;font-weight:500}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;background:rgba(244,242,237,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 30px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.top-title{font-size:19px;font-weight:600}
.top-sub{font-size:12px;color:var(--muted);margin-top:2px}
.top-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:#FFF;border:1px solid var(--line);padding:7px 10px;min-width:230px}
.search svg{width:14px;height:14px;color:var(--faint);flex:0 0 14px}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:12.5px}
.lang{display:flex;border:1px solid var(--line);background:#FFF}
.lang button{border:0;background:transparent;padding:7px 11px;font-size:11px;letter-spacing:.08em;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--ink);color:#F3F1EC}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#FFF;padding:7px 12px;font-size:12px;cursor:pointer;border-radius:var(--radius)}
.btn:hover{border-color:#C9C2B6;background:#FDFCFA}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#F6F4EF}
.btn.primary:hover{background:#1B2E49}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:#E4C6BE}
.btn svg{width:14px;height:14px}

.view{padding:26px 30px 60px;max-width:1500px;width:100%}
.notice{display:flex;align-items:flex-start;gap:10px;border:1px solid #E4D6BC;background:#FBF4E6;padding:11px 14px;font-size:12px;color:#6B5325;margin-bottom:22px}
.notice svg{width:15px;height:15px;flex:0 0 15px;margin-top:2px}
.notice b{font-weight:600}

/* ---------- BOD program cards ---------- */
.prog-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.prog{background:#FFF;border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.prog .p-top{display:flex;align-items:center;gap:10px}
.prog .p-icon{width:30px;height:30px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);flex:0 0 30px}
.prog .p-icon svg{width:16px;height:16px}
.prog h3{font-size:13px}
.prog .p-metric{font-size:25px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.prog .p-metric .k-unit{font-size:11px;color:var(--muted);margin-left:6px;font-weight:400;letter-spacing:0}
.prog p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.6}
.prog .p-act{margin-top:auto}

/* ---------- roadmap ---------- */
.road{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stage{position:relative;padding:14px 16px;border:1px solid var(--line);background:#FFF}
.stage .s-no{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.04em}
.stage h4{font-size:12.5px;margin:6px 0 5px}
.stage p{margin:0;font-size:11px;color:var(--muted);line-height:1.6}
.stage.now{border-color:var(--amber);background:#FDF9F1}
.stage .s-tag{position:absolute;top:12px;right:12px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:600}
.basis-list{display:flex;flex-direction:column;gap:0}
.basis-line{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;padding:8px 0}
.basis-line+.basis-line{border-top:1px solid var(--line)}
.basis-line .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);padding-top:2px}
.basis-line p{margin:0;font-size:11.5px;line-height:1.65;color:#3C4552}

/* ---------- cards / grid ---------- */
.grid{display:grid;gap:16px}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
.card.flat{padding:0;overflow:hidden}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h3{font-size:13px;letter-spacing:.01em}
.card-head .hint{font-size:11px;color:var(--faint)}
.kpi{position:relative;padding:18px 20px;background:#FFF;border:1px solid var(--line)}
.kpi .k-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .k-value{font-size:33px;font-weight:600;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k-unit{font-size:11px;color:var(--muted);margin-left:6px;font-weight:400;letter-spacing:0}
.kpi .k-foot{font-size:11px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:center}
.kpi .bar{position:absolute;left:0;top:0;width:3px;height:100%;background:var(--amber)}
.kpi.t .bar{background:var(--teal)}
.kpi.r .bar{background:var(--red)}
.delta{font-variant-numeric:tabular-nums}
.pos{color:var(--teal)} .neg{color:var(--red)}

.chart{width:100%;height:268px}
.chart.tall{height:300px}
.map-card{padding:16px 18px}
.map-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600;font-size:13px;color:var(--text)}
.map-head a{font-weight:400;font-size:12px;color:var(--blue);text-decoration:none;white-space:nowrap}
.map-head a:hover{text-decoration:underline}
.map-card iframe{width:100%;height:220px;border:0;border-radius:var(--radius);margin-top:12px;display:block;background:var(--paper)}
.map-card.wide iframe{height:420px}
.map-card .leaflet-container{width:100%;height:420px;border-radius:var(--radius);margin-top:12px;z-index:1;font-family:inherit;background:var(--paper)}
.map-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--faint);margin-top:8px}
.map-meta b{color:var(--text)}
.ji-pin span{display:block;width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid #fff;box-shadow:0 1px 3px rgba(14,26,43,.45)}
.map-popup{font-size:12px;color:var(--text);min-width:150px}
.map-popup .mp-id{font-weight:600;font-family:var(--mono,monospace);margin-bottom:3px}
.map-popup .mp-row{color:var(--faint);margin:3px 0}
.map-popup .mp-btn{margin-top:6px;display:inline-block;color:var(--blue);text-decoration:none;font-weight:600;margin-right:10px}
.map-popup .mp-btn:hover{text-decoration:underline}
.map-note{font-size:12px;color:var(--faint);margin-top:10px;line-height:1.5}
.chart-note{font-size:11px;color:var(--faint);margin-top:6px}

/* ---------- section ---------- */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:30px 0 12px}
.sec-head h2{font-size:15px;letter-spacing:-.01em}
.sec-head p{margin:4px 0 0;font-size:12px;color:var(--muted);max-width:70ch}
.hr{height:1px;background:var(--line);margin:26px 0}
.termline{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:0 0 18px;padding-bottom:10px;border-bottom:1px dashed var(--line);min-height:26px}
.termline b{font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:9.5px;color:var(--faint)}

/* ---------- table ---------- */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:0;padding:12px 14px;border-bottom:1px solid var(--line);background:#FCFBF8}
.toolbar .search{min-width:200px;flex:1;max-width:320px;background:#FFF}
.toolbar select{border:1px solid var(--line);background:#FFF;padding:7px 9px;font-size:12px;border-radius:var(--radius)}
.toolbar select[data-f="sort"]{max-width:280px}
.toolbar .count{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:10px 16px;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--ink);border-bottom-color:var(--amber);font-weight:600}
.tab .n{font-variant-numeric:tabular-nums;color:var(--faint);margin-left:6px;font-size:11px}

.tbl-wrap{overflow:auto;max-width:100%}
table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:880px}
th,td{padding:9px 12px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line-2);overflow:hidden;text-overflow:ellipsis}
th{position:sticky;top:0;background:#FCFBF8;z-index:2;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);white-space:normal;line-height:1.3;overflow:visible}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#FAF8F3}
td.mono{font-family:var(--mono);font-size:11.5px;color:#3D4756}
.oname{font-weight:600;color:var(--ink);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.osub{font-size:10.5px;color:var(--faint);margin-top:2px}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.date{white-space:nowrap;color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;font-size:10.5px;letter-spacing:.02em;border:1px solid transparent;white-space:nowrap;border-radius:1px}
.chip i{width:5px;height:5px;background:currentColor;display:inline-block;border-radius:50%}
.flag{margin-left:5px;color:var(--amber);font-size:11px;cursor:help}
.note-card{padding:14px 20px}
.note-line{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;padding:6px 0}
.note-line+.note-line{border-top:1px solid var(--line)}
.note-line .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);padding-top:2px}
.note-line p{margin:0;font-size:11.5px;line-height:1.65;color:#3C4552}
.c-vacant{background:var(--red-soft);color:#7E3223}
.c-partial{background:var(--amber-soft);color:#6B4C14}
.c-stopped{background:#EDEBE6;color:#5A5F66}
.c-operating{background:var(--teal-soft);color:#1F5450}
.c-neutral{background:#EDEBE6;color:#4B5158}
.c-teal{background:var(--teal-soft);color:#1F5450}
.c-amber{background:var(--amber-soft);color:#6B4C14}
.c-red{background:var(--red-soft);color:#7E3223}
.pager{display:flex;align-items:center;gap:6px;padding:12px 14px;border-top:1px solid var(--line);background:#FCFBF8;flex-wrap:wrap}
.pager .range{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:auto}
.pg{min-width:28px;height:28px;border:1px solid var(--line);background:#FFF;font-size:12px;cursor:pointer;display:grid;place-items:center;padding:0 6px}
.pg:hover{border-color:#C9C2B6}
.pg.on{background:var(--ink);color:#F3F1EC;border-color:var(--ink)}
.pg:disabled{opacity:.4;cursor:default}
.empty{padding:46px 20px;text-align:center;color:var(--muted);font-size:12.5px}

/* ---------- detail ---------- */
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}

/* ---------- drawer / form ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,26,43,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,96vw);background:#FFF;z-index:70;transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility .22s ease;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px}
.fgrid .full{grid-column:1/-1}
.formsec{grid-column:1/-1;margin:18px 0 2px;padding:0 0 7px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.formsec:first-child{margin-top:0}
.drawer.on{transform:none;visibility:visible}
.drawer-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:#FCFBF8}
.drawer-head h3{font-size:15px}
.drawer-head p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}
.x{width:30px;height:30px;border:1px solid var(--line);background:#FFF;cursor:pointer;display:grid;place-items:center;flex:0 0 30px}
.x svg{width:14px;height:14px}
.drawer-body{padding:20px 22px;overflow:auto;flex:1}
.drawer-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#FCFBF8}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;letter-spacing:.04em;color:var(--muted);margin-bottom:5px}
.field label .req{color:var(--red);margin-left:3px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#FFF;padding:8px 9px;font-size:12.5px;border-radius:1px;outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(47,79,122,.10)}
.field textarea{min-height:70px;resize:vertical}
.field .err{color:var(--red);font-size:11px;margin-top:4px;display:none}
.field.bad input,.field.bad select{border-color:#D9A092}
.field.bad .err{display:block}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.help{font-size:11px;color:var(--faint);margin-top:3px}

/* ---------- term tooltip ---------- */
.term{border-bottom:1px dotted #8A9099;cursor:help;position:relative}
.term:hover{border-bottom-color:var(--amber);color:var(--ink)}
.tip{position:fixed;z-index:90;max-width:320px;background:var(--ink);color:#F3F1EC;padding:10px 12px;font-size:11.5px;line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .12s;border-left:2px solid #D8A24A}
.tip.on{opacity:1}
.tip .t{font-weight:600;color:#E8C989;display:block;margin-bottom:4px;font-size:11.5px;letter-spacing:.02em}
.tip .d{color:#D5DAE2}

/* ---------- misc ---------- */
.list{display:flex;flex-direction:column;gap:0}
.li{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
.li:last-child{border-bottom:0}
.li .tag{font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 92px}
.li .body{min-width:0;flex:1}
.li .body b{font-weight:600}
.li .body span{color:var(--muted);display:block;font-size:11.5px;margin-top:2px}
.li .act{flex:0 0 auto}
.gloss-item{padding:14px 0;border-bottom:1px solid var(--line-2)}
.gloss-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:34px}
.gloss-grid .gloss-item:nth-last-child(-n+2){border-bottom:0}
.gloss-item:last-child{border-bottom:0}
.gloss-item h4{font-size:13px}
.gloss-item .en{font-size:11px;color:var(--faint);margin:2px 0 6px;font-family:var(--mono)}
.gloss-item p{margin:0;font-size:12.5px;color:#3C4552}
.gloss-item .id{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line-2)}
.settings-row:last-child{border-bottom:0}
.settings-row .txt{max-width:60ch}
.settings-row .txt b{display:block;font-size:13px;margin-bottom:3px}
.settings-row .txt span{font-size:11.5px;color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#F3F1EC;padding:10px 18px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:95;border-left:2px solid #D8A24A}
.toast.on{opacity:1;transform:translateX(-50%)}

@media (max-width:1180px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){
  .app{grid-template-columns:1fr;align-content:start}
  .side{position:relative;height:auto;flex-direction:row;align-items:center;overflow-x:auto;scrollbar-width:none}
  .side::-webkit-scrollbar,.tabs::-webkit-scrollbar{height:0;display:none}
  .brand{border:0;padding:14px 16px;flex:0 0 auto}
  .brand-sub{display:none}
  .nav{display:flex;padding:0 8px;flex:0 0 auto}
  .nav-label,.side-foot{display:none}
  .nav-item{border-left:0;border-bottom:2px solid transparent;padding:12px 12px}
  .nav-item.active{border-left:0;border-bottom-color:#D8A24A}
  .top{padding:12px 16px;gap:10px}
  .view{padding:18px 16px 50px}
  .top-tools{width:100%;margin-left:0;flex-wrap:wrap}
  .top-tools .search{flex:1 1 100%}
  .top-tools .btn.primary{display:none}

const GLOSS = {
  occupancy: { t: ['Occupancy rate', 'Tingkat keterisian'], d: ['Share of approved industrial land that is actually taken up by operating tenants. National average was 57.2% in mid-2026, which is why vacant stock matters.', 'Porsi lahan industri yang disetujui dan benar-benar terpakai oleh penyewa aktif. Rata-rata nasional 57,2% pada pertengahan 2026, karena itu stok kosong menjadi penting.'] },
  oss: { t: ['One-stop service (OSS)', 'Layanan terpadu (OSS)'], d: ['A single office that handles permits, utilities and complaints for tenants instead of routing them across departments. It becomes a revenue line only when services are productised and priced.', 'Satu kantor yang menangani perizinan, utilitas, dan keluhan penyewa alih-alih meneruskannya antar departemen. Menjadi lini pendapatan hanya bila layanan diproduktisasi dan diberi harga.'] },
  sla: { t: ['Service level agreement (SLA)', 'Perjanjian tingkat layanan (SLA)'], d: ['A written response and resolution commitment with a remedy if missed. Without a remedy it is a target, not an agreement.', 'Komitmen tertulis atas respons dan penyelesaian, dengan ganti rugi bila gagal. Tanpa ganti rugi itu hanya target, bukan perjanjian.'] },
  rba: { t: ['Risk-based approach (RBA)', 'Pendekatan berbasis risiko (RBA)'], d: ['The permit route where inspection intensity follows the operator risk rating rather than being uniform. It rewards documented compliance systems.', 'Jalur perizinan di mana intensitas pengawasan mengikuti peringkat risiko operator, bukan seragam. Pendekatan ini menghargai sistem kepatuhan yang terdokumentasi.'] },
  skklh: { t: ['SKKLH', 'SKKLH'], d: ['Statement of environmental management commitment, the baseline environmental approval for a business activity. It is distinct from AMDAL, which applies to higher-impact activities.', 'Pernyataan komitmen pengelolaan lingkungan hidup, persetujuan lingkungan dasar untuk kegiatan usaha. Berbeda dari AMDAL yang berlaku untuk kegiatan berdampak besar.'] },
  permenperin26: { t: ['Permenperin 26/2025', 'Permenperin 26/2025'], d: ['Ministerial regulation on industrial estate standards and accreditation. In force 23 January 2026; existing estates must apply within one year; pass mark 150 points, valid five years.', 'Peraturan menteri tentang standar dan akreditasi kawasan industri. Berlaku 23 Januari 2026; kawasan yang sudah ada harus mengajukan dalam satu tahun; ambang lulus 150 poin, berlaku lima tahun.'] },
  accreditation: { t: ['Estate accreditation', 'Akreditasi kawasan'], d: ['A scored assessment weighting infrastructure 50%, environment 25% and management services 25%. Accreditation is a public signal, not a land title.', 'Penilaian berskor dengan bobot infrastruktur 50%, lingkungan 25%, dan layanan manajemen 25%. Akreditasi adalah sinyal publik, bukan bukti kepemilikan tanah.'] },
  tkdn: { t: ['TKDN', 'TKDN'], d: ['Local content requirement. Government and state-owned projects typically require at least 25% domestic content, which affects equipment sourcing for utility upgrades.', 'Persyaratan kandungan lokal. Proyek pemerintah dan BUMN umumnya mensyaratkan minimal 25% kandungan dalam negeri, yang memengaruhi pengadaan peralatan untuk peningkatan utilitas.'] },
  ifas: { t: ['IFAS', 'IFAS'], d: ['Integrated fixed-film activated sludge: suspended biomass plus fixed media in the same tank, used to raise capacity within an existing footprint.', 'Lumpur aktif dengan film tetap terintegrasi: biomassa tersuspensi plus media tetap dalam tangki yang sama, dipakai menaikkan kapasitas pada lahan yang ada.'] },
  reuse: { t: ['Effluent reuse', 'Daur ulang efluen'], d: ['Treated wastewater sent back to cooling, boiler feed or site washing. Above 20% earns the top environment score in accreditation.', 'Air limbah terolah yang dikembalikan ke pendinginan, air umpan boiler, atau pencucian area. Di atas 20% memperoleh skor lingkungan tertinggi dalam akreditasi.'] },
  rdf: { t: ['RDF', 'RDF'], d: ['Refuse-derived fuel: sorted municipal or industrial waste processed into a fuel substitute for cement kilns or boilers.', 'Bahan bakar turunan sampah: sampah kota atau industri yang disortir dan diolah menjadi pengganti bahan bakar untuk kiln semen atau boiler.'] },
  perf: { t: ['Performance contract', 'Kontrak kinerja'], d: ['An EPC plus operations contract with guaranteed savings or compliance, penalties for shortfall and a metered baseline. It avoids taking asset risk onto the balance sheet.', 'Kontrak EPC plus operasi dengan jaminan penghematan atau kepatuhan, penalti bila gagal, dan basis terukur. Menghindari risiko aset masuk ke neraca.'] },
  leadscore: { t: ['Lead score', 'Skor prospek'], d: ['Pain (1–5) multiplied by budget (1–3), decision authority (1–3) and time window (1–3); 135 is the maximum. It ranks follow-up order, not credit quality.', 'Rasa sakit (1–5) dikalikan anggaran (1–3), kewenangan keputusan (1–3), dan jendela waktu (1–3); maksimum 135. Skor ini mengurutkan prioritas tindak lanjut, bukan kualitas kredit.'] },
  arpu: { t: ['ARPU', 'ARPU'], d: ['Average revenue per paying tenant per year. Used here to model service revenue without assuming every tenant buys.', 'Pendapatan rata-rata per penyewa berbayar per tahun. Dipakai untuk memodelkan pendapatan layanan tanpa mengasumsikan semua penyewa membeli.'] },
  loading: { t: ['Loading rate', 'Beban hidrolik'], d: ['Actual inflow divided by design capacity over the same period. Below 60% is under-used, 60–80% is workable, above 80% is efficient, above 100% means the plant is overloaded and effluent risk rises.', 'Debit masuk aktual dibagi kapasitas desain pada periode yang sama. Di bawah 60% kurang termanfaatkan, 60–80% wajar, di atas 80% efisien, di atas 100% berarti instalasi kelebihan beban dan risiko efluen naik.'] },
  baku: { t: ['Effluent standard (baku mutu)', 'Baku mutu efluen'], d: ['The discharge limits set by the environment ministry for the industrial activity. Compliance is measured per parameter (BOD, COD, TSS, pH, ammonia) against the permit, not as one average score.', 'Batas pembuangan yang ditetapkan kementerian lingkungan untuk kegiatan industri. Kepatuhan diukur per parameter (BOD, COD, TSS, pH, amonia) terhadap izin, bukan sebagai satu skor rata-rata.'] },
  mbbr: { t: ['MBBR', 'MBBR'], d: ['Moving bed biofilm reactor: floating plastic carriers host the biofilm, so capacity can be raised by adding media rather than new tanks.', 'Moving bed biofilm reactor: media plastik mengapung menjadi tempat biofilm, sehingga kapasitas dapat dinaikkan dengan menambah media, bukan tangki baru.'] },
  od: { t: ['Oxidation ditch (OD)', 'Kolam oksidasi (OD)'], d: ['A looped aeration channel with long retention time; stable against shock loads, but high energy use per cubic metre.', 'Saluran aerasi berbentuk loop dengan waktu tinggal panjang; stabil terhadap beban kejut, tetapi konsumsi energi per meter kubik tinggi.'] },
  as: { t: ['Activated sludge (AS)', 'Lumpur aktif (AS)'], d: ['Suspended-growth process with aeration and sludge return. The reference technology for BOD and ammonia removal in industrial estates.', 'Proses pertumbuhan tersuspensi dengan aerasi dan pengembalian lumpur. Teknologi acuan untuk penyisihan BOD dan amonia di kawasan industri.'] },
  clearance: { t: ['Clear height', 'Tinggi bersih'], d: ['Usable height from floor to the lowest roof or sprinkler line. Warehouse listings here run 6–8 m at the eaves and 8–14 m at the ridge; below 6 m limits container stacking and racking.', 'Tinggi terpakai dari lantai ke titik terendah atap atau jalur sprinkler. Gudang di sini berkisar 6–8 m di tepi dan 8–14 m di puncak; di bawah 6 m membatasi penumpukan kontainer dan rak.'] },
  serviceCharge: { t: ['Service charge', 'Service charge'], d: ['A monthly estate fee per m² on top of rent, covering security, roads, drainage and common-area upkeep. Listed at Rp 1,500–3,000 per m² per month and normally excluded from the headline rent.', 'Biaya kawasan bulanan per m² di luar sewa, mencakup keamanan, jalan, drainase, dan pemeliharaan area bersama. Tercatat Rp 1.500–3.000 per m² per bulan dan biasanya tidak termasuk dalam sewa utama.'] },
  deposit: { t: ['Security deposit', 'Deposit jaminan'], d: ['Refundable cash held by the owner, usually two to three months of rent, paid partly on the offering letter and the rest at lease signing. It protects the owner against early termination, not against wear.', 'Uang yang ditahan pemilik dan dapat dikembalikan, biasanya dua sampai tiga bulan sewa, dibayar sebagian saat surat penawaran dan sisanya saat penandatanganan. Melindungi pemilik dari penghentian dini, bukan dari keausan.'] },

const fmtDate = (iso) => {

  return new Intl.DateTimeFormat(LANG === 'en' ? 'en-GB' : 'id-ID', { day: '2-digit', month: 'short', year: 'numeric' }).format(d);

function nextAssetId(kawasan) {
  const code = ESTATE_CODE[kawasan] || 'NEW';
  const yy = String(new Date().getFullYear()).slice(2);
  const seq = (STATE.assets || []).filter((a) => String(a.asset_id).indexOf('-' + code + '-' + yy + '-') > -1)
    .map((a) => Number(String(a.asset_id).split('-').pop()) || 0);
  const next = (seq.length ? Math.max.apply(null, seq) : 0) + 1;
  return 'JI-' + code + '-' + yy + '-' + String(next).padStart(4, '0');
}

  return '<span class="term" data-g="' + key + '">' + esc(label) + '</span>';
}

/* ================= STORAGE ================= */
function loadData() {
  let stored = null;
  try { stored = localStorage.getItem(LS_KEY); } catch (e) { stored = null; }
  if (stored) {
    try {
      const parsed = JSON.parse(stored);
      if (parsed && parsed.assets && parsed.owners) {
        if (!parsed.plants) {
          const fresh = seedData();
          parsed.plants = fresh.plants;
          parsed.metrics = fresh.metrics;
        }
        /* migrate older asset records to the price-basis model */
        parsed.assets.forEach((a) => {
          if (a.priceUnit == null) a.priceUnit = (a.intent === 'lease' ? 'm2mo' : 'm2');
          if (a.geo == null) a.geo = 'pending';
          if (a.lat == null) a.lat = '';
          if (a.lon == null) a.lon = '';
        });
        return parsed;
      }
    } catch (e) { /* fall through to demo */ }
  }
  const seeded = seedData();
  try { localStorage.setItem(LS_KEY, JSON.stringify(seeded)); } catch (e) { /* private mode or file:// */ }
  return seeded;
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(STATE)); } catch (e) { toast(t('c.badFile')); }
}

/* ================= SHARED UI ================= */
function openDrawer(title, sub, body, foot) {
  el('drawerTitle').textContent = title;
  el('drawerSub').textContent = sub || '';
  el('drawerBody').innerHTML = body;
  el('drawerFoot').innerHTML = foot || '';
  el('scrim').classList.add('on');
  el('drawer').classList.add('on');
}
function closeDrawer() {
  el('scrim').classList.remove('on');
  el('drawer').classList.remove('on');
}
function toast(msg) {
  const x = el('toast');
  x.textContent = msg;
  x.classList.add('on');
  clearTimeout(x._t);
  x._t = setTimeout(() => x.classList.remove('on'), 2200);
}

function chipFor(group, code) {
  const tone = code === 'vacant' ? 'c-vacant' : code === 'partial' ? 'c-partial' : code === 'stopped' ? 'c-stopped' : code === 'operating' ? 'c-operating'
    : code === 'closed' || code === 'delivered' || code === 'converted' ? 'c-teal'
      : code === 'lost' || code === 'dropped' || code === 'high' ? 'c-red'
        : code === 'offer' || code === 'loi' || code === 'active' || code === 'qualified' ? 'c-amber' : 'c-neutral';
  return '<span class="chip ' + tone + '"><i></i>' + esc(E(group, code)) + '</span>';
}

function pagerHtml(key, total, page, size) {
  const pages = Math.max(1, Math.ceil(total / size));
  const start = total === 0 ? 0 : (page - 1) * size + 1;
  const end = Math.min(total, page * size);
  let btns = '';
  for (let p = 1; p <= pages; p++) {
    if (p === 1 || p === pages || Math.abs(p - page) <= 1) {
      btns += '<button class="pg ' + (p === page ? 'on' : '') + '" data-pg="' + key + '" data-to="' + p + '">' + p + '</button>';
    } else if (Math.abs(p - page) === 2) {
      btns += '<span style="color:#9AA0A8;padding:0 2px">…</span>';
    }
  }
  return '<div class="pager"><div class="range">' + t('c.showing') + ' ' + start + '–' + end + ' ' + t('c.of') + ' ' + total + ' ' + t('c.total') + '</div>'
    + '<button class="pg" data-pg="' + key + '" data-to="' + Math.max(1, page - 1) + '"' + (page === 1 ? ' disabled' : '') + '>‹</button>'
    + btns
    + '<button class="pg" data-pg="' + key + '" data-to="' + Math.min(pages, page + 1) + '"' + (page === pages ? ' disabled' : '') + '>›</button></div>';
}

function paginate(key, rows, size) {
  size = size || 12;
  const pages = Math.max(1, Math.ceil(rows.length / size));
  let page = PAGE[key] || 1;
  if (page > pages) page = pages;
  PAGE[key] = page;
  return { slice: rows.slice((page - 1) * size, page * size), pager: pagerHtml(key, rows.length, page, size) };
}

function filterRows(rows, key, fields) {
  const f = FILTER[key] || {};
  let out = rows;
  Object.keys(f).forEach((k) => {
    if (k !== 'q' && k !== 'sort' && f[k]) out = out.filter((r) => String(r[k]) === String(f[k]));
  });
  const q = (f.q || '').toLowerCase().trim();
  if (q) out = out.filter((r) => fields.some((fl) => String(r[fl] == null ? '' : r[fl]).toLowerCase().includes(q)));
  return out;
}

/* glossary strip: terms shown at their first appearance on a page, hover to explain */
function termLine(keys) {
  const items = keys.map((k) => gl(k)).join('');
  return '<div class="termline"><b>' + esc(LANG === 'en' ? 'Terms' : 'Istilah') + '</b>' + items + '</div>';
}

/* ================= METRICS ================= */
const OPEN_STAGES = ['lead', 'viewing', 'offer', 'loi', 'dd'];
function kpis() {
  const a = STATE.assets;
  const idle = a.filter((x) => x.status === 'vacant' || x.status === 'stopped');
  const idleArea = idle.reduce((s, x) => s + Number(x.build || x.land || 0), 0);
  const open = STATE.demands.filter((d) => OPEN_STAGES.includes(d.stage));
  const matched = open.filter((d) => d.assetLink).length;
  const signed = STATE.deals.filter((d) => d.svcStatus === 'active' || d.svcStatus === 'delivered');
  const revenue = signed.reduce((s, d) => s + Number(d.value || 0), 0);
  const quoted = STATE.deals.filter((d) => d.svcStatus === 'quoted');
  const quotedValue = quoted.reduce((s, d) => s + Number(d.value || 0), 0);
  const quality = a.length ? a.reduce((s, x) => s + Number(x.quality || 0), 0) / a.length : 0;
  const latest = latestMonth();
  const ww = STATE.metrics.filter((m) => m.period === latest && m.metric === 'reuse');
  const reuse = ww.length ? ww.reduce((s, m) => s + Number(m.value), 0) / ww.length : 0;
  const reuseGap = Math.max(0, 20 - reuse);
  return { total: a.length, idle: idle.length, idleArea, idleShare: a.length ? (idle.length / a.length) * 100 : 0, open: open.length, matched, delivered: signed.length, revenue, quoted: quoted.length, quotedValue, quality, reuse, reuseGap, latest };
}
function latestMonth() {
  const periods = STATE.metrics.map((m) => m.period).sort();
  return periods.length ? periods[periods.length - 1] : '';
}
function monthLabel(p) {
  const d = new Date(p + '-01T00:00:00');
  return new Intl.DateTimeFormat(LANG === 'en' ? 'en-GB' : 'id-ID', { month: 'short', year: '2-digit' }).format(d);
}
function metricSeries(plant, ind) {
  const rows = STATE.metrics.filter((m) => m.plant === plant && m.metric === ind).sort((x, y) => x.period < y.period ? -1 : 1);

}

const READING_CAP = {
  'Cikarang WTP 1 + 2': 63936, 'Cikarang WWTP IFAS': 15750, 'Cikarang WWTP OD': 12000,
  'Kendal WTP': 41472, 'Kendal WWTP 1A': 1000, 'Kendal WWTP 1B': 4000, 'Kendal WWTP 1B ext': 16200,
};
function capM3d(p) { return Number(p.cap) * (p.cup === 'Lps' ? 86.4 : 1); }
function capLps(p) { return Number(p.cap) / (p.cup === 'Lps' ? 1 : 86.4); }
function loadingPct(plant, period) {
  const flow = STATE.metrics.find((m) => m.plant === plant && m.metric === 'flow' && m.period === period);
  const cap = READING_CAP[plant];
  return flow && cap ? Number(flow.value) / cap * 100 : null;
}

    const g = GLOSS[k];
    return `<div class="gloss-item"><h4>${esc(g.t[0])}</h4><p>${esc(g.d[0])}</p>
      <div class="id"><h4>${esc(g.t[1])}</h4><p>${esc(g.d[1])}</p></div></div>`;
  }).join('');
  el('view').innerHTML = `<div class="card" style="margin-bottom:16px"><p style="margin:0;font-size:12.5px;color:#3C4552">${esc(t('g.intro'))}</p>
    <p style="margin:8px 0 0;font-size:11.5px;color:var(--muted)">${esc(t('g.note'))}</p></div>
    <div class="card"><div class="gloss-grid">${items}</div></div>`;
}

function recTitle(entity, r) {
  if (!r) return '';
  if (entity === 'asset') return r.asset_id + ' · ' + r.kawasan;
  if (entity === 'owner') return r.name;
  if (entity === 'demand') return r.company;
  if (entity === 'deal') return r.sku;
  if (entity === 'lead') return r.company;
  if (entity === 'metric') return r.plant + ' · ' + r.period;
  if (entity === 'plant') return r.name + ' · ' + r.estate;
  return '';
}
function fmtAssetPrice(a) {
  if (a.price === '' || a.price == null) return '—';
  const u = a.priceUnit || (a.intent === 'lease' ? 'm2mo' : 'm2');
  const v = Number(a.price || 0);
  if (u === 'm2mo') return fmtRp(v) + t('c.sqmMonth');
  if (u === 'tot') return fmtRpShort(v);
  return fmtRpShort(v) + '/m²';
}
function assetPerM2(a) {
  const u = a.priceUnit || (a.intent === 'lease' ? 'm2mo' : 'm2');
  const v = Number(a.price || 0);
  if (u === 'tot') return a.build ? v / Number(a.build) : 0;
  return v;
}
function showVal(rec, k, spec) {
  const v = rec[k];
  if (v === '' || v == null) return '—';
  if (spec.g) return esc(E(spec.g, v));
  if (k === 'verified' || k === 'start' || k === 'availableFrom') return esc(fmtDate(v));
  if (k === 'price') return esc(fmtAssetPrice(rec));
  if (k === 'escalationPct') return esc(fmtDec(v, 1) + '%');
  if (MONEY.includes(k)) return esc(fmtRpShort(v));
  if (spec.t === 'number') return esc(k === 'land' ? fmtArea(v) : fmtInt(v));
  return esc(tl(v));
}

function plantDetailExtra(rec) {
  const derived = capM3d(rec);
  return '<div class="card flat" style="margin-top:18px;border:1px solid var(--line)">'
    + '<div class="kv" style="grid-template-columns:150px minmax(0,1fr)">'
    + '<dt>' + esc(t('d.derived')) + '</dt><dd class="mono">' + esc(fmtInt(derived) + ' ' + volU()) + '</dd>'
    + '</div>'
    + (rec.counted === 'no' ? '<p class="help" style="margin:10px 0 0">' + esc(t('d.flagNote')) + '</p>' : '')
    + '</div>';
}

let _allMap = null;
function initAllMap(list) {
  const box = el('allMap');
  if (!box) return;
  if (_allMap) { _allMap.remove(); _allMap = null; }
  if (typeof L === 'undefined') {
    box.innerHTML = '<div class="map-note">' + esc(t('a.mapAllNote')) + '</div>';
    return;
  }
  const map = L.map(box, { scrollWheelZoom: false }).setView([-6.2855, 107.1580], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '© OpenStreetMap contributors'
  }).addTo(map);
  const group = (typeof L.markerClusterGroup === 'function') ? L.markerClusterGroup() : L.layerGroup();
  const icon = L.divIcon({ className: 'ji-pin', html: '<span></span>', iconSize: [14, 14], iconAnchor: [7, 7] });
  list.forEach((a) => {
    const addrParts = [a.alamat, a.blok ? 'Blok ' + a.blok : '', 'Kawasan Industri Jababeka', 'Cikarang, Bekasi, Jawa Barat']
      .map((x) => String(x || '').trim()).filter(Boolean);
    const q = encodeURIComponent(addrParts.join(', '));
    const mk = L.marker([Number(a.lat), Number(a.lon)], { icon });
    mk.bindPopup('<div class="map-popup"><div class="mp-id">' + esc(a.asset_id) + '</div>'
      + '<div class="mp-row">' + esc(a.blok) + ' · ' + esc(a.alamat) + '</div>'
      + '<div class="mp-row">' + esc(t('F.land')) + ': ' + fmtArea(a.land) + ' m²</div>'
      + '<a class="mp-btn" data-map-open="' + esc(a.asset_id) + '">' + esc(t('a.openRecord')) + '</a>'
      + '<a class="mp-btn" target="_blank" rel="noopener" href="https://www.google.com/maps?q=' + q + '">' + esc(t('f.mapOpen')) + '</a></div>');
    group.addLayer(mk);
  });
  map.addLayer(group);
  if (list.length) { const b = group.getBounds(); if (b && b.isValid()) map.fitBounds(b.pad(0.15)); }
  _allMap = map;
}

function assetDetailExtra(rec) {
  const rent = (rec.priceUnit === 'm2mo' || (!rec.priceUnit && rec.intent === 'lease')) ? Number(rec.price || 0) * Number(rec.build || 0) : 0;
  const dep = rent && rec.depositMonths ? rent * Number(rec.depositMonths) : 0;
  const fit = rec.fitoutCost && rec.build ? Number(rec.fitoutCost) * Number(rec.build) : 0;
  const rows = [];
  if (rent) rows.push('<dt>' + esc(t('d.assetRent')) + '</dt><dd class="mono">' + esc(fmtRpShort(rent)) + '</dd>');
  if (dep) rows.push('<dt>' + esc(t('d.assetDeposit')) + '</dt><dd class="mono">' + esc(fmtRpShort(dep)) + '</dd>');
  if (fit) rows.push('<dt>' + esc(t('d.assetFitout')) + '</dt><dd class="mono">' + esc(fmtRpShort(fit)) + '</dd>');
  const addrParts = [rec.alamat, rec.blok ? 'Blok ' + rec.blok : '', 'Kawasan Industri Jababeka', 'Cikarang, Bekasi, Jawa Barat']
    .map((x) => String(x || '').trim()).filter(Boolean);
  const q = encodeURIComponent(addrParts.join(', '));
  let html = '';
  if (rows.length) {
    html += '<div class="card flat" style="margin-top:18px;border:1px solid var(--line)">'
      + '<div class="kv" style="grid-template-columns:200px minmax(0,1fr)">' + rows.join('') + '</div></div>';
  }
  if (rec.owner_id) {
    html += '<div class="card flat" style="margin-top:18px;border:1px solid var(--line)"><button class="btn ghost" data-open-owner="' + esc(rec.owner_id) + '">' + esc(t('a.openOwner')) + '</button></div>';
  }
  html += '<div class="card flat map-card" style="margin-top:18px;border:1px solid var(--line)">'
    + '<div class="map-head"><span>' + esc(t('f.map')) + '</span>'
    + '<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=' + q + '">' + esc(t('f.mapOpen')) + '</a></div>'
    + '<iframe title="' + esc(t('f.map')) + '" src="https://www.google.com/maps?q=' + q + '&output=embed" loading="lazy" referrerpolicy="no-referrer"></iframe>'
    + '</div>';
  return html;
}

function openDetail(entity, id) {
  const meta = E_TYPES[entity];
  const rec = (STATE[meta.coll] || []).find((r) => String(r[meta.idKey]) === String(id));
  if (!rec) return;
  DRAWER = { entity: entity, id: id };
  const body = '<dl class="kv">' + meta.fields.map((f) => '<dt>' + esc(t(f.label || ('F.' + f.k))) + '</dt><dd>' + showVal(rec, f.k, f) + '</dd>').join('') + '</dl>';
  const extra = entity === 'plant' ? plantDetailExtra(rec) : entity === 'asset' ? assetDetailExtra(rec) : '';
  el('drawerTitle').textContent = t(meta.title);
  el('drawerSub').textContent = recTitle(entity, rec);
  el('drawerBody').innerHTML = body + extra;
  el('drawerFoot').innerHTML = '<button class="btn" data-close="1">' + esc(t('c.close')) + '</button>'
    + '<button class="btn danger" data-del="' + esc(id) + '">' + esc(t('c.delete')) + '</button>'
    + '<button class="btn primary" data-edit="' + esc(id) + '">' + esc(t('c.edit')) + '</button>';
  el('scrim').classList.add('on');
  el('drawer').classList.add('on');
}

function openForm(entity, id) {
  const meta = E_TYPES[entity];
  const isEdit = id != null;
  const rec = isEdit ? (STATE[meta.coll] || []).find((r) => String(r[meta.idKey]) === String(id)) || {} : {};
  const fullSet = ['alamat', 'permits', 'authority', 'notes', 'pain', 'sku', 'ubo', 'structure', 'liens', 'contact'];
  let lastSec = null;
  const fields = meta.fields.map((f) => {
    const val = rec[f.k] == null ? '' : rec[f.k];
    let input = '';
    if (f.t === 'select') {
      const opts = f.opts || Object.keys(ENUM[f.g] || {});
      input = '<select data-f="' + f.k + '"' + (f.req ? ' data-req="1"' : '') + '><option value="">' + esc(t('c.select')) + '</option>'
        + opts.map((o) => '<option value="' + esc(o) + '"' + (String(val) === String(o) ? ' selected' : '') + '>' + esc(f.opts ? o : E(f.g, o)) + '</option>').join('') + '</select>';
    } else if (f.t === 'textarea') {
      input = '<textarea data-f="' + f.k + '">' + esc(val) + '</textarea>';
    } else {
      input = '<input data-f="' + f.k + '" type="' + (f.t === 'number' ? 'number' : f.t === 'date' ? 'date' : 'text') + '" value="' + esc(val) + '"' + (f.t === 'number' ? ' step="any"' : '') + (f.req ? ' data-req="1"' : '') + '>';
    }
    const full = f.t === 'textarea' || fullSet.includes(f.k);
    let head = '';
    if (f.sec && f.sec !== lastSec) {
      lastSec = f.sec;
      head = '<div class="formsec">' + esc(t('sec.' + f.sec)) + '</div>';
    }
    return head + '<div class="field' + (full ? ' full' : '') + '"><label>' + esc(t(f.label || ('F.' + f.k))) + (f.req ? '<span class="req">*</span>' : '') + '</label>' + input
      + (f.hint ? '<div class="help">' + esc(t(f.hint)) + '</div>' : '') + '<div class="err">' + esc(t('c.required')) + '</div></div>';
  }).join('');

  el('drawerTitle').textContent = isEdit ? t('f.editTitle') : t('f.newTitle');
  el('drawerSub').textContent = t(meta.title) + ' · ' + t(meta.sub);
  el('drawerBody').innerHTML = '<div style="font-size:11.5px;color:var(--muted);margin-bottom:16px">' + esc(t('f.requiredHint')) + ' * ' + esc(t('f.requiredHint2')) + '</div>'
    + '<div class="fgrid">' + fields + '</div>'
    + (['asset', 'demand', 'owner'].includes(entity) ? '<div class="help">' + esc(t('f.numberHint')) + '</div>' : '');
  el('drawerFoot').innerHTML = '<button class="btn" data-close="1">' + esc(t('c.cancel')) + '</button><button class="btn primary" data-save="' + entity + '"' + (isEdit ? ' data-orig="' + esc(id) + '"' : '') + '>' + esc(t('c.save')) + '</button>';
  el('scrim').classList.add('on');
  el('drawer').classList.add('on');
}

function saveForm(entity) {
  const meta = E_TYPES[entity];
  const body = el('drawerBody');
  const inputs = body.querySelectorAll('[data-f]');
  let ok = true;
  const rec = {};
  inputs.forEach((inp) => {
    const f = meta.fields.find((x) => x.k === inp.dataset.f);
    const wrap = inp.closest('.field');
    wrap.classList.remove('bad');
    const raw = inp.value.trim();
    if (f.req && raw === '') { wrap.classList.add('bad'); ok = false; return; }
    if (f.t === 'number' && raw !== '' && isNaN(Number(raw))) { wrap.classList.add('bad'); ok = false; return; }
    rec[f.k] = raw === '' ? '' : (f.t === 'number' ? Number(raw) : raw);
  });
  if (!ok) return;

  /* referential checks */
  if (entity === 'asset' && rec.owner_id && !STATE.owners.some((o) => o.id === rec.owner_id)) {
    toast(t('f.ownerLink')); return;
  }
  if (entity === 'demand' && rec.assetLink && !STATE.assets.some((a) => a.asset_id === rec.assetLink)) {
    toast(t('f.assetLink')); return;
  }

  const idKey = meta.idKey;
  if (!rec[idKey]) rec[idKey] = entity === 'asset' ? nextAssetId(rec.kawasan) : uid(meta.prefix);
  const saveBtn = el('drawerFoot').querySelector('[data-save]');
  const origId = saveBtn && saveBtn.dataset.orig != null ? saveBtn.dataset.orig : null;
  if (origId != null && String(origId) !== String(rec[idKey])) {
    if ((STATE[meta.coll] || []).some((r) => String(r[idKey]) === String(rec[idKey])) || String(rec[idKey]) === String(origId)) {
      toast(t('c.dupId')); return;
    }
    const idx = (STATE[meta.coll] || []).findIndex((r) => String(r[idKey]) === String(origId));
    if (idx >= 0) STATE[meta.coll][idx] = Object.assign({}, STATE[meta.coll][idx], rec);
    else (STATE[meta.coll] = STATE[meta.coll] || []).push(rec);
    /* keep relations pointing at the renamed record */
    if (entity === 'asset') STATE.demands.forEach((d) => { if (String(d.assetLink) === String(origId)) d.assetLink = rec[idKey]; });
    if (entity === 'owner') STATE.assets.forEach((a) => { if (String(a.owner_id) === String(origId)) a.owner_id = rec[idKey]; });
    save(); closeDrawer(); toast(t('c.saved')); renderView(); return;
  }
  const existing = (STATE[meta.coll] || []).findIndex((r) => String(r[idKey]) === String(rec[idKey]));
  if (existing >= 0) {
    STATE[meta.coll][existing] = Object.assign({}, STATE[meta.coll][existing], rec);
  } else {
    (STATE[meta.coll] = STATE[meta.coll] || []).push(rec);
  }
  save();
  closeDrawer();
  toast(t('c.saved'));
  renderView();
}

function deleteRecord() {
  const meta = E_TYPES[DRAWER.entity];
  if (!meta) return;
  if (!confirm(t('c.confirmDelete'))) return;
  STATE[meta.coll] = STATE[meta.coll].filter((r) => String(r[meta.idKey]) !== String(DRAWER.id));
  save();
  closeDrawer();
  toast(t('c.deleted'));
  renderView();
}

/* ================= EXPORT / IMPORT ================= */
function exportJson() {
  const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = 'ji-platform-' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  toast(t('c.exported'));
}
function importJson(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result));
      if (!parsed || !parsed.assets || !parsed.owners) throw new Error('shape');
      if (!parsed.plants) parsed.plants = seedData().plants;
      STATE = parsed;
      save();
      toast(t('c.imported'));
      renderView();
    } catch (e) { toast(t('c.badFile')); }
  };
  reader.readAsText(file);
}

/* ================= NAV & RENDER ================= */
let DRAWER = { entity: null, id: null };
const ICONS = {
  dashboard: '<path d="M4 13h6V4H4v9zM14 20h6v-9h-6v9zM4 20h6v-4H4v4zM14 8h6V4h-6v4z"/>',
  assets: '<path d="M3 21V8l6-4 6 4v13M15 21V11l6-4v14M3 21h18M7 12h2M7 16h2M17 14h2"/>',
  services: '<path d="M4 7h16v13H4zM4 7l3-3h10l3 3M8 13h8"/>',
  utilities: '<path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/>',
  glossary: '<path d="M4 5h7a3 3 0 0 1 3 3v11a3 3 0 0 0-3-3H4zM20 5h-4a3 3 0 0 0-3 3v11a3 3 0 0 1 3-3h4z"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
};
function renderNav() {
  const item = (v, k) => `<div class="nav-item ${VIEW === v ? 'active' : ''}" data-view="${v}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${ICONS[v]}</svg><span>${esc(t(k))}</span></div>`;
  el('nav').innerHTML = '<div class="nav-label">' + esc(t('nav.g1')) + '</div>'
    + item('dashboard', 'nav.dashboard') + item('assets', 'nav.assets') + item('services', 'nav.services') + item('utilities', 'nav.utilities')
    + '<div class="nav-label">' + esc(t('nav.g2')) + '</div>' + item('glossary', 'nav.glossary') + item('settings', 'nav.settings');
  el('brandName').textContent = t('app.name');
  el('brandSub').textContent = t('app.brandSub');
  el('sideFoot').textContent = t('app.foot');
  el('btnExportTxt').textContent = t('c.export');
  el('btnNewTxt').textContent = t('c.new');
  el('langSwitch').innerHTML = '<button data-lang="en" class="' + (LANG === 'en' ? 'on' : '') + '">EN</button><button data-lang="id" class="' + (LANG === 'id' ? 'on' : '') + '">ID</button>';
  document.documentElement.lang = LANG;
  document.title = t('app.docTitle');
  el('globalSearch').placeholder = t('c.search');
}

function renderView() {
  SEEN = {};
  clearCharts();
  const title = t('v.' + VIEW + '.title');
  const sub = t('v.' + VIEW + '.sub');
  el('topTitle').textContent = title;
  el('topSub').textContent = sub;
  if (VIEW === 'dashboard') viewDashboard();
  else if (VIEW === 'assets') viewAssets();
  else if (VIEW === 'services') viewServices();
  else if (VIEW === 'utilities') viewUtilities();
  else if (VIEW === 'glossary') viewGlossary();
  else if (VIEW === 'settings') viewSettings();
  const active = el('nav').querySelector('.nav-item.active');
  if (!active) renderNav();
  else {
    el('nav').querySelectorAll('.nav-item').forEach((n) => n.classList.toggle('active', n.dataset.view === VIEW));
  }
  el('searchBox').style.display = ['glossary', 'settings'].includes(VIEW) ? 'none' : '';
  el('btnNew').style.display = ['glossary', 'settings'].includes(VIEW) ? 'none' : '';
}

function go(view) {
  VIEW = view;
  SEEN = {};
  renderNav();
  renderView();
}

/* ================= EVENTS ================= */
let qTimer = null;
function bindEvents() {
  document.addEventListener('click', (e) => {
    const lang = e.target.closest('[data-lang]');
    if (lang) { setLang(lang.dataset.lang); return; }
    const nav = e.target.closest('[data-view]');
    if (nav) { go(nav.dataset.view); return; }
    const tab = e.target.closest('[data-tab]');
    if (tab) { TAB[tab.dataset.tab] = tab.dataset.t; PAGE[tab.dataset.tab + '_' + tab.dataset.t] = 1; renderView(); return; }
    const add = e.target.closest('[data-add]');
    if (add) { openForm(add.dataset.add, null); return; }
    const row = e.target.closest('tr[data-entity]');
    if (row) { openDetail(row.dataset.entity, row.dataset.id); return; }
    const oo = e.target.closest('[data-open-owner]');
    if (oo) { openDetail('owner', oo.dataset.openOwner); return; }
    const mp = e.target.closest('[data-map-open]');
    if (mp) { openDetail('asset', mp.dataset.mapOpen); return; }
    const pg = e.target.closest('[data-pg]');
    if (pg) { PAGE[pg.dataset.pg] = Number(pg.dataset.to); renderView(); return; }
    const goto = e.target.closest('[data-goto]');
    if (goto) { go(goto.dataset.goto); return; }
    const act = e.target.closest('[data-act]');
    if (act) {
      if (act.dataset.act === 'export') exportJson();
      if (act.dataset.act === 'import') {
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'application/json,.json';
        inp.onchange = () => { if (inp.files && inp.files[0]) importJson(inp.files[0]); };
        inp.click();
      }
      if (act.dataset.act === 'reset') {
        if (confirm(t('c.confirmReset'))) { STATE = seedData(); save(); toast(t('c.resetDone')); renderView(); }
      }
      return;
    }
    const edit = e.target.closest('[data-edit]');
    if (edit) { openForm(DRAWER.entity, edit.dataset.edit); return; }
    const del = e.target.closest('[data-del]');
    if (del) { deleteRecord(); return; }
    const saveBtn = e.target.closest('[data-save]');
    if (saveBtn) { saveForm(saveBtn.dataset.save); return; }
    if (e.target.closest('[data-close]') || e.target.id === 'scrim' || e.target.id === 'drawerClose') { closeDrawer(); return; }
  });

  document.addEventListener('change', (e) => {
    const sel = e.target.closest('[data-sel]');
    if (sel) {
      FILTER[sel.dataset.sel] = FILTER[sel.dataset.sel] || {};
      FILTER[sel.dataset.sel][sel.dataset.f] = sel.value;
      PAGE[sel.dataset.sel] = 1;
      renderView();
    }
  });

  document.addEventListener('input', (e) => {
    const q = e.target.closest('[data-q]');
    if (q) {
      const key = q.dataset.q;
      FILTER[key] = FILTER[key] || {};
      FILTER[key].q = q.value;
      PAGE[key] = 1;
      clearTimeout(qTimer);
      qTimer = setTimeout(() => {
        renderView();
        const again = document.querySelector('[data-q="' + key + '"]');
        if (again) { again.focus(); const v = again.value; again.setSelectionRange(v.length, v.length); }
      }, 320);
      return;
    }
    if (e.target.id === 'globalSearch') {
      const v = e.target.value;
      const key = VIEW === 'utilities' ? 'metrics' : VIEW === 'services' ? (TAB.services === 'deals' ? 'deals' : 'leads') : VIEW === 'assets' ? TAB.assets : null;
      if (!key) { if (v.trim()) { go('assets'); FILTER.assets = { q: v }; renderView(); } return; }
      FILTER[key] = FILTER[key] || {};
      FILTER[key].q = v;
      clearTimeout(qTimer);
      qTimer = setTimeout(() => { renderView(); if (el('globalSearch')) el('globalSearch').value = v; }, 320);
    }
  });

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

  el('btnExport').addEventListener('click', exportJson);
  el('btnNew').addEventListener('click', () => {
    const entity = VIEW === 'services' ? (TAB.services === 'deals' ? 'deal' : 'lead') : VIEW === 'utilities' ? (TAB.utilities === 'readings' ? 'metric' : 'plant') : VIEW === 'assets' ? (TAB.assets === 'demands' ? 'demand' : 'asset') : 'asset';
    openForm(entity, null);
  });

  /* glossary tooltip, first use only */
  const tip = el('tip');
  document.addEventListener('mouseover', (e) => {
    const term = e.target.closest('.term');
    if (!term) return;
    const g = GLOSS[term.dataset.g];
    if (!g) return;
    tip.querySelector('.t').textContent = g.t[LANG === 'en' ? 0 : 1];
    tip.querySelector('.d').textContent = g.d[LANG === 'en' ? 0 : 1];
    const r = term.getBoundingClientRect();
    tip.classList.add('on');
    const tw = Math.min(320, tip.offsetWidth);
    let left = Math.max(12, Math.min(r.left + r.width / 2 - tw / 2, window.innerWidth - tw - 12));
    let top = r.bottom + 8;
    if (top + tip.offsetHeight > window.innerHeight - 12) top = r.top - tip.offsetHeight - 8;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  });
  document.addEventListener('mouseout', (e) => { if (e.target.closest('.term')) tip.classList.remove('on'); });
  document.addEventListener('scroll', () => tip.classList.remove('on'), true);

  window.addEventListener('resize', () => { CH.forEach((c) => { try { c.resize(); } catch (e) {} }); });
}

/* ================= INIT ================= */
function setLang(l) {
  LANG = l === 'id' ? 'id' : 'en';
  try { localStorage.setItem('ji_lang', LANG); } catch (e) { /* storage unavailable */ }
  renderNav();
  renderView();
}

let INITIALIZED = false;
function init() {
  if (INITIALIZED) return;
  INITIALIZED = true;
  /* parity check: every string record must carry exactly two non-empty entries */
  const bad = Object.keys(STR).filter((k) => !Array.isArray(STR[k]) || STR[k].length !== 2 || !STR[k][0] || !STR[k][1]);
  const badEnum = Object.keys(ENUM).filter((g) => Object.keys(ENUM[g]).some((c) => !ENUM[g][c] || ENUM[g][c].length !== 2));
  const badGloss = Object.keys(GLOSS).filter((g) => GLOSS[g].t.length !== 2 || GLOSS[g].d.length !== 2);
  if (bad.length || badEnum.length || badGloss.length) console.warn('i18n gaps', bad, badEnum, badGloss);

  LANG = (function () { try { return localStorage.getItem('ji_lang') === 'id' ? 'id' : 'en'; } catch (e) { return 'en'; } })();
  STATE = loadData();
  try {
    const qp = new URLSearchParams(location.search);
    const v = qp.get('v');
    if (['dashboard', 'assets', 'services', 'utilities', 'glossary', 'settings'].includes(v)) VIEW = v;
    const tb = qp.get('tab');
    if (tb && TAB[v] !== undefined) TAB[v] = tb;
    if (qp.get('lang') === 'id') LANG = 'id';
  } catch (e) { /* ignore */ }
  bindEvents();
  renderNav();
  renderView();
}

document.addEventListener('DOMContentLoaded', init);
if (document.readyState !== 'loading') init();
/* @@APPEND@@ */
